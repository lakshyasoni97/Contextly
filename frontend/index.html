<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contextly — Semantic Icon Finder</title>
  <meta name="description" content="Drop a slide, get the right icons. Contextly uses AI to understand what your slide means and finds icons that actually match the intent." />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>

<div class="app">

  <!-- ──────────────── Header ──────────────── -->
  <header class="header">
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24">
          <polygon points="12 2 2 7 12 12 22 7 12 2"/>
          <polyline points="2 17 12 22 22 17"/>
          <polyline points="2 12 12 17 22 12"/>
        </svg>
      </div>
      <span class="logo-text">Contextly</span>
    </div>
    <p class="tagline">Drop a slide, get the right icons — instantly.</p>
  </header>

  <!-- ──────────────── Input Card ──────────────── -->
  <section class="input-card" aria-label="Input">

    <div class="tab-bar" role="tablist">
      <button class="tab-btn active" id="tab-text" role="tab" aria-selected="true" aria-controls="panel-text">Paste Text</button>
      <button class="tab-btn" id="tab-image" role="tab" aria-selected="false" aria-controls="panel-image">Upload Slide</button>
    </div>

    <!-- Text panel -->
    <div class="tab-panel active" id="panel-text" role="tabpanel">
      <textarea id="slide-text" class="slide-textarea"
        placeholder="Paste your slide text, bullet points, or topic here…"
        aria-label="Slide text input" maxlength="4000"></textarea>
      <div class="submit-row">
        <span class="char-count" id="char-count">0 / 4000</span>
        <button class="btn-primary" id="analyze-text-btn" aria-label="Find icons from text">
          <span class="spinner" aria-hidden="true"></span>
          <svg class="btn-arrow" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          Find Icons
        </button>
      </div>
    </div>

    <!-- Image panel -->
    <div class="tab-panel" id="panel-image" role="tabpanel">
      <div class="drop-zone" id="drop-zone" aria-label="Upload slide image">
        <input type="file" id="file-input" accept="image/png,image/jpeg,image/webp" aria-label="Select image file" />
        <div class="drop-icon">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        </div>
        <p class="drop-label">Drop your slide screenshot here</p>
        <p class="drop-hint">PNG, JPG or WebP · max 10 MB</p>
      </div>

      <div class="drop-preview" id="drop-preview">
        <img id="preview-thumb" src="" alt="Preview" />
        <span class="drop-preview-name" id="preview-name"></span>
        <button class="drop-preview-remove" id="remove-image" aria-label="Remove image">×</button>
      </div>

      <div class="submit-row" style="margin-top:16px;">
        <span></span>
        <button class="btn-primary" id="analyze-image-btn" aria-label="Find icons from image">
          <span class="spinner" aria-hidden="true"></span>
          <svg class="btn-arrow" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          Find Icons
        </button>
      </div>
    </div>

    <div class="error-banner" id="error-banner" role="alert"></div>
  </section>

  <!-- ──────────────── Results ──────────────── -->
  <section id="results-section" style="display:none;" aria-label="Icon results">

    <div class="results-header">
      <div>
        <p class="results-title">Extracted Concepts</p>
        <div class="concept-chips" id="concept-chips"></div>
      </div>
      <span class="results-count" id="results-count"></span>
    </div>

    <!-- Grid + Customizer side by side -->
    <div class="results-layout">

      <div class="icon-grid" id="icon-grid" role="list"></div>

      <!-- ── Customizer Panel ── -->
      <aside class="customizer-panel" id="customizer-panel" aria-label="Icon customizer">
        <div class="customizer-header">
          <span class="customizer-title">Customizer</span>
          <button class="customizer-reset" id="reset-customizer" title="Reset to defaults" aria-label="Reset customizer">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
              <path d="M3 3v5h5"/>
            </svg>
          </button>
        </div>

        <!-- Color -->
        <div class="ctrl-group">
          <div class="ctrl-row ctrl-spread">
            <label class="ctrl-label" for="ctrl-color">Color</label>
            <div class="ctrl-color-wrap">
              <input type="color" id="ctrl-color" value="#e8edff" class="ctrl-color-input" aria-label="Icon color" />
              <span class="ctrl-color-hex" id="ctrl-color-hex">#e8edff</span>
            </div>
          </div>
        </div>

        <!-- Stroke width -->
        <div class="ctrl-group">
          <div class="ctrl-label-row">
            <label class="ctrl-label" for="ctrl-stroke">Stroke width</label>
            <span class="ctrl-value" id="ctrl-stroke-val">2</span>
          </div>
          <input type="range" id="ctrl-stroke" min="0.5" max="3" step="0.25" value="2"
            class="ctrl-slider ctrl-slider--accent" aria-label="Stroke width" />
        </div>

        <!-- Size -->
        <div class="ctrl-group">
          <div class="ctrl-label-row">
            <label class="ctrl-label" for="ctrl-size">Size</label>
            <span class="ctrl-value" id="ctrl-size-val">40px</span>
          </div>
          <input type="range" id="ctrl-size" min="16" max="64" step="4" value="40"
            class="ctrl-slider" aria-label="Icon size" />
        </div>

        <div class="ctrl-divider"></div>

        <!-- Absolute stroke width -->
        <div class="ctrl-group">
          <div class="ctrl-row ctrl-spread">
            <label class="ctrl-label" for="ctrl-abs-stroke">Absolute stroke width</label>
            <label class="toggle">
              <input type="checkbox" id="ctrl-abs-stroke" />
              <span class="toggle-track"></span>
            </label>
          </div>
          <p class="ctrl-hint">Stroke won't scale with icon size</p>
        </div>

        <!-- Filled -->
        <div class="ctrl-group">
          <div class="ctrl-row ctrl-spread">
            <label class="ctrl-label" for="ctrl-filled">Filled</label>
            <label class="toggle">
              <input type="checkbox" id="ctrl-filled" />
              <span class="toggle-track"></span>
            </label>
          </div>
        </div>

        <!-- Circle background -->
        <div class="ctrl-group">
          <div class="ctrl-row ctrl-spread">
            <label class="ctrl-label" for="ctrl-circle">Circle background</label>
            <label class="toggle">
              <input type="checkbox" id="ctrl-circle" />
              <span class="toggle-track"></span>
            </label>
          </div>
        </div>

      </aside>
    </div>

    <div class="empty-state" id="empty-state">
      No icons matched. Try rewording your slide content.
    </div>

  </section>

</div>

<div id="toast" role="status" aria-live="polite"></div>

<script src="/static/app.js"></script>
</body>
</html>
